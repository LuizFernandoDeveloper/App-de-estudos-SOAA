<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" font-family="Segoe UI, sans-serif">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111f31"/>
      <stop offset="1" stop-color="#0c1828"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#152f37"/>
      <stop offset="1" stop-color="#11243c"/>
    </linearGradient>
  </defs>

  <rect width="760" height="500" fill="#08111f"/>
  <ellipse cx="640" cy="0" rx="320" ry="160" fill="#101d2d"/>
  <ellipse cx="120" cy="520" rx="280" ry="200" fill="#16243a"/>

  <!-- header -->
  <g transform="translate(24 24)">
    <rect width="712" height="62" rx="15" fill="url(#hdr)" stroke="#31536a"/>
    <text x="26" y="29" font-size="14" font-weight="700" fill="#eff6ff">Retenção por Matéria e Nicho</text>
    <text x="26" y="48" font-size="11" fill="#93a5bd">FSRS hierárquico · a memória decai por rede semântica, não homogênea</text>
    <g transform="translate(486 16)" font-size="11">
      <rect x="0" y="-12" width="104" height="26" rx="13" fill="#5e223044" stroke="#a040525c"/>
      <circle cx="17" cy="-1" r="5" fill="#ff5a71"/>
      <text x="29" y="3" font-weight="700" fill="#ffb9c4">Nicho em colapso</text>
    </g>
    <g transform="translate(598 16)" font-size="11">
      <rect x="0" y="-12" width="100" height="26" rx="13" fill="#123a2d3d" stroke="#2f7a5d66"/>
      <circle cx="17" cy="-1" r="5" fill="#34d399"/>
      <text x="29" y="3" font-weight="700" fill="#a7f3d0">Rede estável</text>
    </g>
  </g>

  <!-- chart -->
  <g transform="translate(24 106)">
    <rect width="712" height="280" rx="15" fill="url(#pg)" stroke="#213148"/>

    <!-- grid -->
    <g stroke="#203044" stroke-width="1" stroke-dasharray="4 4">
      <line x1="60" y1="230" x2="690" y2="230"/>
      <line x1="60" y1="185" x2="690" y2="185"/>
      <line x1="60" y1="140" x2="690" y2="140"/>
      <line x1="60" y1="95" x2="690" y2="95"/>
      <line x1="60" y1="50" x2="690" y2="50"/>
    </g>
    <g stroke="#203044" stroke-width="1">
      <line x1="60" y1="24" x2="60" y2="230"/>
      <line x1="60" y1="230" x2="690" y2="230"/>
    </g>
    <g font-size="10" fill="#8195ad" text-anchor="middle">
      <text x="60" y="242">D0</text>
      <text x="165" y="242">D15</text>
      <text x="270" y="242">D30</text>
      <text x="375" y="242">D45</text>
      <text x="480" y="242">D60</text>
      <text x="690" y="242">D75</text>
    </g>
    <g font-size="10" fill="#8195ad">
      <text x="44" y="54" text-anchor="end">100</text>
      <text x="44" y="99" text-anchor="end">80</text>
      <text x="44" y="144" text-anchor="end">60</text>
      <text x="44" y="189" text-anchor="end">40</text>
      <text x="44" y="234" text-anchor="end">20</text>
      <text x="18" y="120" font-size="9" fill="#5f7690" transform="rotate(-90 18 120)">retenção %</text>
    </g>

    <!-- 90% alert line -->
    <line x1="60" y1="68" x2="690" y2="68" stroke="#ff5a71" stroke-width="1.4" stroke-dasharray="6 4"/>
    <rect x="60" y="54" width="150" height="13" rx="6.5" fill="#4b202c" stroke="#d75c74" stroke-width="1"/>
    <text x="70" y="63.5" font-size="9.5" font-weight="700" fill="#ffd3da">Alerta · revisar a 90%</text>

    <!-- Med Global -->
    <path d="M60 40 C 120 44 160 58 220 88 C 290 124 360 164 430 200 C 500 222 600 238 690 242"
          fill="none" stroke="#94a3b8" stroke-width="3"/>
    <!-- subject: Matematica -->
    <path d="M60 42 C 130 46 180 66 250 100 C 330 142 430 190 540 226 C 600 240 660 244 690 246"
          fill="none" stroke="#818cf8" stroke-width="2.5"/>
    <!-- topic em colapso -->
    <path d="M60 44 C 100 48 130 62 160 86 C 190 112 210 150 230 176 C 260 206 300 226 350 236"
          fill="none" stroke="#ff5a71" stroke-width="2.5" stroke-dasharray="6 5"/>
    <!-- Anki FSRS com reset -->
    <path d="M60 40 C 140 40 170 46 220 40 C 270 34 300 58 350 50 C 410 41 450 74 520 58 C 580 44 650 56 690 46"
          fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 4" opacity="0.95"/>

    <!-- alert marker at crossing -->
    <circle cx="160" cy="88" r="6" fill="#08111f" stroke="#ff5a71" stroke-width="3"/>
    <circle cx="160" cy="88" r="2" fill="#ff5a71"/>

    <text x="60" y="268" font-size="10" fill="#8195ad">O nicho cruza os 90% no 16º dia: é o ponto ótimo para revisar (mantém R perto de 100%</text>
    <text x="60" y="283" font-size="10" fill="#8195ad">e dobra o Stability). A média global ainda parece estável enquanto o nicho colapsa.</text>

    <!-- legend -->
    <g transform="translate(60 296)" font-size="10.5">
      <rect x="0" y="-12" width="120" height="24" rx="12" fill="#0d1b2d" stroke="#213148"/>
      <line x1="14" y1="0" x2="44" y2="0" stroke="#94a3b8" stroke-width="3"/>
      <text x="52" y="4" fill="#dbe6f4">Média geral</text>
      <rect x="132" y="-12" width="132" height="24" rx="12" fill="#0d1b2d" stroke="#213148"/>
      <line x1="146" y1="0" x2="176" y2="0" stroke="#818cf8" stroke-width="2.5"/>
      <text x="184" y="4" fill="#dbe6f4">Matemática · Geom.</text>
      <rect x="276" y="-12" width="146" height="24" rx="12" fill="#0d1b2d" stroke="#213148"/>
      <line x1="290" y1="0" x2="320" y2="0" stroke="#ff5a71" stroke-width="2.5" stroke-dasharray="6 5"/>
      <text x="328" y="4" fill="#dbe6f4">Nicho em colapso</text>
      <rect x="434" y="-12" width="150" height="24" rx="12" fill="#0d1b2d" stroke="#213148"/>
      <line x1="448" y1="0" x2="478" y2="0" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="486" y="4" fill="#dbe6f4">FSRS com revisão</text>
    </g>
  </g>

  <!-- side stats -->
  <g transform="translate(24 406)" font-size="11">
    <rect x="0" y="-14" width="228" height="30" rx="10" fill="#0d1b2d" stroke="#213148"/>
    <text x="16" y="6" fill="#8195ad">R global</text>
    <text x="92" y="6" font-weight="800" fill="#55e6aa">92.3%</text>
    <rect x="236" y="-14" width="228" height="30" rx="10" fill="#0d1b2d" stroke="#213148"/>
    <text x="252" y="6" fill="#8195ad">Nicho de risco</text>
    <text x="350" y="6" font-weight="800" fill="#ffca76">R 61% · 3 itens</text>
    <rect x="472" y="-14" width="240" height="30" rx="10" fill="#0d1b2d" stroke="#213148"/>
    <text x="488" y="6" fill="#8195ad">Revisões planejadas hoje</text>
    <text x="630" y="6" font-weight="800" fill="#22d3ee">8</text>
  </g>
</svg>
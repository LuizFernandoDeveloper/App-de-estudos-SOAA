      <rect x="18" y="184" width="296" height="34" rx="8" fill="#1d453925" stroke="#2f8f6a59"/>
      <rect x="18" y="184" width="16" height="34" rx="8" fill="#1d453925" stroke="#2f8f6a59"/>
      <path d="M22 199 L25 202 L32 195" stroke="#63eeb3" stroke-width="2" fill="none" transform="translate(0 4)"/>
      <circle cx="48" cy="201" r="4" fill="#34d399"/>
      <text x="60" y="205" fill="#c1e7d8" text-decoration="line-through" text-decoration-color="#63eeb3">Revisar nicho de Análise Comb.</text>

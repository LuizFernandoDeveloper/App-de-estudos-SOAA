      <text x="262" y="76" font-weight="700" fill="#e6f0ff">3</text>
      <text x="296" y="76" fill="#55e6aa" font-weight="700">IP 15</text>

      <rect x="0" y="102" width="324" height="30" rx="4" fill="#101d2d"/>

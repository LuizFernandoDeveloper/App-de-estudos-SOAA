      <circle cx="42" cy="289" r="4" fill="#f472b6"/>
      <text x="54" y="293" fill="#c4d1e0">Matemática · Cálculo (Limites)</text>
      <text x="226" y="293" fill="#8195ad">manhã · 60 min</text>
      <rect x="18" y="312" width="296" height="30" rx="8" fill="#101d2d" stroke="#213148"/>
      <circle cx="42" cy="327" r="4" fill="#ffca76"/>
      <text x="54" y="331" fill="#c4d1e0">Lista 3 questões ITA · Estatística</text>

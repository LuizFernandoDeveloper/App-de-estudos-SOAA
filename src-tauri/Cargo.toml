[package]
name = "soaa"
version = "0.1.0"
description = "Sistema Operacional de Autodidatismo Avançado"
authors = ["SOAA"]
edition = "2024"

[lib]
name = "soaa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.38", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }

# O Smart App Control (os error 4551) bloqueia a DLL debug reproduzível desse
# proc-macro; o opt-level diverge o binário e libera o carregamento no Windows.
[profile.dev.package."serialize-to-javascript-impl"]
opt-level = 1

